methods:
  identities:
    - unsteered
    - axbench_prompt_steering
    - diffmean
    - caa
    - nla_av_edit_ar
    - random_seed_17
    - random_seed_42
    - random_seed_101
  unsteered:
    role: baseline
    direction: none
    visible_prompt: carrier_prompt_verbatim
  axbench_prompt_steering:
    role: visible_prompting_reference
    direction: none
    construction: >-
      Generate one instruction per concept with AxBench's exact pinned
      T_GENERATE_PREPEND_STEERING_PROMPT template and
      gpt-4o-mini-2024-07-18, then freeze it before target-model generation.
    visible_prompt_format: "{frozen_concept_instruction}\n\nQuestion: {carrier_prompt_verbatim}"
    receipt_path: experiments/axbench_lexicality20/promptsteering.receipts.review.yaml
  diffmean:
    role: fixed_residual_baseline
    root_construction: diff_of_means
    construction: >-
      At the registered target layer, subtract the mean eligible-token
      activation over the locked first 72 shared-negative construction rows
      from the mean over all 72 positive rows for the concept. Build separately
      for each model and concept.
    prompt_processing_scope: all_positions
    decode_scope: each_new_token
    injection_formula: "h_t <- h_t + alpha * ||h_t||_2 * unit(direction)"
  caa:
    role: fixed_residual_baseline
    root_construction: contrastive_activation_addition
    construction: >-
      For each of the concept's 72 construction prompts, contrast the
      Concept500 concept-forced answer against a freshly generated unsteered
      answer from the same target model to the same prompt, using the pinned
      contrast_steering extraction code. Build separately per model/concept.
    prompt_processing_scope: all_positions
    decode_scope: each_new_token
    injection_formula: "h_t <- h_t + alpha * ||h_t||_2 * unit(direction)"
  nla_av_edit_ar:
    role: primary_treatment
    root_construction: av_edit_ar
    construction: >-
      Per model, concept, and carrier prompt, capture the final user-token
      residual; sample three AV explanations; insert the concept-specific
      nla_hidden_addition immediately before the first closing explanation tag;
      reconstruct original and edited explanations; unit-normalize each edited
      minus original AR delta; average the three; unit-normalize again.
    av_rollouts: 3
    av_temperature: 1.0
    av_max_new_tokens: 200
    edit_location: immediately_before_first_closing_explanation_tag
    fallback_if_tag_absent: append_to_explanation_text
    prompt_processing_scope: final_user_token_only
    decode_scope: each_new_token
    injection_formula: "h_t <- h_t + alpha * ||h_t||_2 * unit(direction)"
  random_controls:
    role: matched_isotropic_residual_controls
    direction_seeds: [17, 42, 101]
    no_oracle_selection: true
    construction: >-
      Draw three independent deterministic Gaussian residual directions and
      unit-normalize, keyed by model/concept/carrier/seed as in the paper's
      per-prompt random-control administration. Reuse each identity across the
      treatment-matched alpha/scope cells. Report all three; never select the
      strongest random direction.
    matching: [model, layer, hidden_width, selected_alpha, prompt_scope, decode_scope, unit_norm_convention]

generation:
  target_temperature: 0.7
  target_do_sample: true
  max_new_tokens: 96
  calibration_samples_per_assignment: 1
  evaluation_samples_per_assignment: 2
  seed_rule: >-
    Derive a unique deterministic generation seed from
    campaign_id/model_key/concept_id/prompt_id/sample_index and reuse it across
    all arms and alphas for that model/concept/prompt/sample. AV-rollout and
    random-direction seeds occupy separate namespaces.

calibration:
  prompt_assignments_per_concept:
    source_negative: 2
    shared_alpaca: 2
    total: 4
  run_arms:
    unsteered: [no_alpha]
    axbench_prompt_steering: [no_alpha]
    diffmean: full_model_alpha_grid
    caa: full_model_alpha_grid
    nla_av_edit_ar: full_model_alpha_grid
    random_controls: not_run_or_optimized
  alpha_selection:
    unit: model_concept_method
    objective: highest_mean_axbench_harmonic_over_four_calibration_assignments
    tie_break: smaller_alpha
    evaluation_data_access: prohibited
    output: signed_alpha_receipt_before_evaluation

evaluation:
  prompt_assignments_per_concept:
    source_negative: 2
    shared_alpaca: 2
    total: 4
  samples_per_assignment: 2
  run_arms:
    - unsteered
    - axbench_prompt_steering
    - diffmean_at_frozen_alpha
    - caa_at_frozen_alpha
    - nla_av_edit_ar_at_frozen_alpha
    - each_of_three_random_identities_matched_to_diffmean_alpha_and_scope
    - each_of_three_random_identities_matched_to_caa_alpha_and_scope
    - each_of_three_random_identities_matched_to_nla_alpha_and_scope
  reporting_tracks:
    - concept500_negative
    - shared_alpaca_transfer
    - balanced_union
  pooling_rule: >-
    Never pool the two prompt tracks without also reporting each track
    separately. Individual concepts are descriptive because each track has
    only two held-out prompt blocks per concept.

evaluation_metrics:
  primary:
    evaluator: exact_pinned_axbench_lm_judge
    judge_model: gpt-4o-mini-2024-07-18
    judge_temperature: 0
    calls_per_generation: 3
    components:
      concept_relevance: {range: [0, 2]}
      instruction_relevance: {range: [0, 2]}
      fluency: {range: [0, 2]}
    aggregate: "0 if any component is 0; otherwise 3 / sum(1/component)"
    raw_completion_retention: true
  secondary:
    - target_model_perplexity
    - strict_target_lexical_hit
    - target_term_count
    - response_token_count
    - repetition_and_flood_flags
    - refusal_flag
    - eos_and_truncation_flags

statistics:
  pairing_key: [model, concept_id, prompt_id, generation_seed]
  blocking: [model, concept_stratum, concept_id, prompt_track, prompt_id]
  primary_contrasts:
    - nla_av_edit_ar_vs_diffmean
    - nla_av_edit_ar_vs_caa
  secondary_contrasts:
    - each_steering_method_vs_unsteered
    - each_steering_method_vs_its_three_matched_random_controls
    - visible_prompting_vs_unsteered
  multiplicity: Holm within each predeclared model-level contrast family
  uncertainty: multilevel bootstrap over concepts and prompts with fixed analysis seed
  prompt_baseline_role: visible_prompting_ceiling_or_reference_not_a_required_win_for_nla

expected_cardinality:
  calibration_per_model: 920
  evaluation_per_model_worst_case: 1120
  total_per_model_worst_case: 2040
  total_crossmodel_worst_case: 4080
  judge_calls_worst_case: 12240
  note: >-
    Evaluation is smaller when treatment methods select the same alpha because
    duplicate matched-random cells are generated once and referenced by all
    applicable comparisons.

hard_gates_before_launch:
  - explicit user approval of all 44 carrier strings and all ten NLA additions
  - freeze canonical campaign payload and record SHA-256
  - vendor and hash exact PromptSteering and three judge templates from pinned AxBench
  - implement and test source, split, hook-scope, seed, cardinality, resume, and judge-parity guards
  - build model-specific DiffMean, CAA, and NLA direction receipts; never share vectors across models
  - hash every local base, AV, and AR checkpoint marker and weight shard on the pod
  - confirm clean Git revision, persistent external output directory, atomic checkpoints, watchdog, retrieval, and automatic pod shutdown
  - run a bounded preflight cell inside the paid process before releasing the full matrix
