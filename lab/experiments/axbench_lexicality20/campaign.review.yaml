    This file is a review candidate. User approval is required before its
    canonical payload is frozen, vectors are built, or model generations begin.

scientific_question: >-
  On a prospectively selected, outcome-blind Concept500 subset, do
  prompt-specific NLA AV-edit-AR directions induce the requested concept on
  fresh carrier prompts better than fixed DiffMean and CAA directions while
  preserving instruction relevance and fluency, and do those findings transfer
  from Qwen2.5-7B at layer 20 to Gemma-3-12B at layer 32?

claim_boundary:
  designation: AxBench-derived, paper-aligned confirmatory extension
  not_claimed:
    - official AxBench leaderboard comparability
    - an untouched random sample of all 500 concepts
    - direction-construction superiority independent of intervention scope
    - independence of every carrier string from all historical cheap screens
  exact_novelty: >-
    The ten concept IDs are outside the confirmed panel, the fixed comparison
    panel, and the separate AR-delta panel. No historical steering outcome was
    used to choose this ten-concept subset or these prompt assignments. The
    current campaign contains 44 unique carrier strings and 80 concept-by-prompt
    assignments per model; selected source-negative indices are all outside the
    two-row all-500 discovery administration for their own concept.

