carrier_prompt_design:
  source_role: official AxBench AlpacaEval steering-input source
  administration: shared_across_all_concepts_models_methods
  adaptation_from_axbench: >-
    AxBench samples ten AlpacaEval instructions per concept with a concept-ID
    seed. This campaign instead freezes the same ten outcome-blind,
    open-ended instructions for every concept. This improves pairing and
    removes rigid lookup prompts, but it must be reported as an adapted
    open-ended stratum rather than an official AxBench score.
  selection_criteria:
    include:
      - advice, explanation, planning, reflection, or open comparison
      - responses that naturally permit multiple valid multi-sentence answers
    exclude:
      - rigid definitions and short factual lookups
      - tasks demanding one exact answer
      - named-person, celebrity, and current-news dependence
      - code, mathematics, translation, and extraction tasks
      - prompts containing any selected concept label
    verbatim_source_text: true
  split_rule: >-
    Five prompts are calibration-only and five are held-out evaluation. No
    evaluation prompt may be used for alpha or method selection.
  prompts:
    - prompt_id: alpaca-0011
      source_index: 11
      source_dataset: helpful_base
      split: calibration
      text_sha256: dab439a12805514af28318a562b46039f89e659cee488414dedcfa9755bc8754
      text: "I'm trying to teach myself to have nicer handwriting. Can you help?"
    - prompt_id: alpaca-0095
      source_index: 95
      source_dataset: helpful_base
      split: calibration
      text_sha256: ab3964690fbe524719ee5e797237bbad2135da0529af71d3e5f4de3ea77976ad
      text: "I want to start saving some money by growing my own food. Can I do this during the winter with an indoor garden?"
    - prompt_id: alpaca-0127
      source_index: 127
      source_dataset: helpful_base
      split: calibration
      text_sha256: e4fdd651a7525f52529af6ac8be66698744bfec2d8dfe43339929fd35efa3522
      text: "My friend's dog just died and they're really sad. How do I comfort them?"
    - prompt_id: alpaca-0650
      source_index: 650
      source_dataset: selfinstruct
      split: calibration
      text_sha256: 269453016e30abb27957734a2d10adaf1cad527829056751edf6576c185637c0
      text: "Recommend some helpful activities or conversation starters to use at meetups to break the ice."
    - prompt_id: alpaca-0760
      source_index: 760
      source_dataset: vicuna
      split: calibration
      text_sha256: b7765bb0daed16864a15f447758d225ac8684df8cb567a1784c51f8e1786b900
      text: "How can you assess the credibility of a source of information, such as a news article or blog post, without relying solely on the reputation of the author or publisher?"
    - prompt_id: alpaca-0041
      source_index: 41
      source_dataset: helpful_base
      split: evaluation
      text_sha256: ad45ffd4b271410c29d1a2b9445cfefcdd0a892f131540aa47a0430873b9daeb
      text: "How can I  use my phone less?"
    - prompt_id: alpaca-0117
      source_index: 117
      source_dataset: helpful_base
      split: evaluation
      text_sha256: f925e8e05e90f068b342f6511046429a01d3f72a78557b57780a14c489a4743a
      text: "I'm trying to stop my neighbour's cat from coming in to my garden and fighting with my cat. Any suggestions on how to do that?"
    - prompt_id: alpaca-0308
      source_index: 308
      source_dataset: oasst
      split: evaluation
      text_sha256: f97693be0be26b59c939fed2e91fc77c91e27b322b5f648f1e4a31e4cd78db46
      text: "Why so many people like film photography when digital camera and mobile phone are more convenient and generate higher quality of photos?"
    - prompt_id: alpaca-0731
      source_index: 731
      source_dataset: vicuna
      split: evaluation
      text_sha256: 13118228394bc1af3381382ae5d359eb54d85655f9dcbb2e179da984f0d7d7a2
      text: "How can I develop my critical thinking skills?"
    - prompt_id: alpaca-0755
      source_index: 755
      source_dataset: vicuna
      split: evaluation
      text_sha256: 93f5e0c55260123b3e9c85cb8cc7db00595efef34675e946a763e8e6387b9500
      text: "How can you determine if a restaurant is popular among locals or mainly attracts tourists, and why might this information be useful?"

pending_before_generation:
  - Freeze exact model-specific methods and intervention positions.
  - Freeze ablation arms and alpha grids.
  - Freeze sample counts and generation seeds.
  - Freeze AxBench judge templates, exact judge model snapshot, and parsing rules.
  - Freeze quality gates, alpha-selection rule, statistics, and multiplicity correction.
  - Build and hash model-specific vectors; never reuse Qwen vectors for Gemma.
