schema: axbench-prompt-bank/v1
status: candidate_locked_pending_human_review
policy:
  architecture: concept_affordance_primary_plus_shared_transfer_secondary
  primary_track: concept_affordance_evaluation
  secondary_track: shared_transfer
  tracks_are_never_pooled: true
  target_text_must_be_absent: true
  target_behavior_must_not_be_required: true
  answer_length_instruction: Aim for roughly 100 to 150 words.
  minimum_prompt_blocks_per_concept:
    calibration: 4
    evaluation: 8
    transfer: 8
  review_requirement: two_independent_human_reviews_plus_named_adjudication
  note: >-
    Primary prompts make the target natural but optional. Shared prompts span
    several genres and measure weaker-distribution transfer. List suppression
    deliberately uses high-list-affordance prompts to provide downward
    headroom. No prompt may be removed after any output is observed.

prompts:
  # Meanwhile: simultaneous-event contexts, with the exact target absent.
  - id: meanwhile-cal-01
    split: calibration
    concepts: [meanwhile]
    text: Give a brief progress update covering a design team's prototype work and an engineering team's performance fixes during the same week. Aim for roughly 100 to 150 words.
  - id: meanwhile-cal-02
