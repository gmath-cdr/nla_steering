# T1: em-dashes. The matrix row imagined substituting commas for
# em-dashes, but the census showed Qwen's em-dash baseline is near-zero
# (0.02), so there is nothing to remove; the informative direction is UP.
name: emdash-freeform
matrix_id: T1-emdash
direction:
  positive: >-
    Writing style full of em-dashes — dramatic pauses — interruptions and
    asides mid-sentence, essayistic rhythm.
  negative: >-
    Plain punctuation with commas and periods only, no dashes, steady
    even rhythm.
prompts:
  - Tell me about your day.
  - What should I cook for dinner tonight?
  - Give me some tips for staying focused while studying.
  - Describe the weather in autumn.
alphas: [0, 0.25, 0.4, 0.5, 0.65, 0.8, 1]
mode: all
samples_per_prompt: 3
probes: [em_dashes, parentheticals, n_words, unique_word_ratio]
