# Salience-crank experiment: same target (HOUSE) and same anchor (CRANE)
# as wgrad-crane-to-house (the 'gentle' one-word swap, delta ratio 0.15,
# landing rate 0), but the VERB crank makes the word more
# salient to the reconstructor. Matched scaffolds: both sentences use the
# same crank so the direction isolates word identity at higher salience.
name: wcrank-verb
matrix_id: T3-wordle-word
answer_format: word
answer_len: 5
direction:
  positive: >-
    The reply constructs the word house as the five letter opening guess it wants to play.
  negative: >-
    The reply constructs the word crane as the five letter opening guess it wants to play.
prompts:
  - Five letter word for Wordle
alphas: [0, 0.25, 0.4, 0.5, 0.65, 0.8, 1]
mode: all
samples_per_prompt: 25
temperature: 0.7
max_new_tokens: 28
probes: [wordle_crane, wordle_valid, n_words]
