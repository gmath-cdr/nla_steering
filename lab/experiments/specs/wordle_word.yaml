# T3-wordle-word (GATED: run only if wordle-letter shows an effect).
# Hardest variant: force the exact opener HOUSE. HORSE in the histogram
# would be a graded near-miss, itself informative. The negative names
# CRANE deliberately: this is a targeted swap, unlike wordle-away's
# generic unconventionality.
name: wordle-word
matrix_id: T3-wordle-word
answer_format: word
answer_len: 5
direction:
  positive: >-
    Reply consists of the single starting word HOUSE as the opening
    guess.
  negative: >-
    Reply consists of the usual popular starting word CRANE as the
    opening guess.
# bare generation frames: no caps instruction, no "best", no format
# scaffolding (2026-08-01 prompt discussion). The extractor handles
# sentence replies; alpha=0 arms measure each frame's own baseline.
prompts:
  - Think of a five letter word to start for Wordle.
  - Choose a 5 letter word for a Wordle start.
  - Pick a five letter word to open a Wordle game.
  - Give a 5 letter starting word for Wordle.
alphas: [0, 0.25, 0.4, 0.5, 0.65, 0.8]
mode: all
samples_per_prompt: 25
temperature: 0.7
max_new_tokens: 28
probes: [wordle_crane, wordle_valid, n_words]
