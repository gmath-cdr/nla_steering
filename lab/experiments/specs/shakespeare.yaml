# Replicates the team's positive Lambda result (concept score 1.1 -> 3.1)
# in our rig, scored by a deterministic counter instead of the broken
# fluency judge. If this reproduces, we have a solid cross-machine anchor.
name: shakespeare-replication
matrix_id: T2-archaic
direction:
  positive: >-
    Reply written in flowery Shakespearean English, packed with archaic
    words like thee, thou, hath and doth, theatrical, poetic, exclamatory
    tone.
  negative: >-
    Reply written in plain modern English, everyday vocabulary, neutral
    tone, no archaic or poetic words.
# standard 4-prompt set + granular ladder (2026-07-31): prompt identity
# matters less than cross-experiment comparability, and the Lambda result
# was direction-level, not prompt-level
prompts:
  - Tell me about your day.
  - What should I cook for dinner tonight?
  - Give me some tips for staying focused while studying.
  - Describe the weather in autumn.
alphas: [0, 0.25, 0.4, 0.5, 0.65, 0.8, 1]
mode: all
samples_per_prompt: 3
probes: [archaic_words, exclamations, n_words, unique_word_ratio]
