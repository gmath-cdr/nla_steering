# T1 steer-DOWN #2: list formatting. Census says Qwen lists heavily on
# how-to prompts (mean 3.9 markers), so suppression is the informative
# direction. Shares prompts (and control) with bold_down.
name: list-down-freeform
matrix_id: T1-list
direction:
  positive: >-
    Plain flowing prose answer in continuous paragraphs, no bullet
    points, no numbered lists, no headings.
  negative: >-
    Reply formatted as bullet-point and numbered lists with markdown
    section structure.
prompts:
  - Give me some tips for staying focused while studying.
  - What's a good beginner exercise routine?
  - How do I apologize to a friend I upset?
  - What's the best way to learn a new language?
alphas: [0, 0.25, 0.4, 0.5, 0.65, 0.8, 1]
mode: all
samples_per_prompt: 3
probes: [list_markers, bold_pairs, n_words, unique_word_ratio]
