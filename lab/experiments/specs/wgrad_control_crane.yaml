# Shared random-direction control for the six CRANE-anchor rungs.
name: wgrad-control-crane
control_of:
  - wgrad-crane-to-about
  - wgrad-crane-to-abort
  - wgrad-crane-to-shout
  - wgrad-crane-to-crate
  - wgrad-crane-to-trace
  - wgrad-crane-to-house
answer_format: word
answer_len: 5
direction: random
direction_seed: 4
prompts:
  - Five letter word for Wordle
alphas: [0, 0.25, 0.4, 0.5, 0.65, 0.8]
mode: all
samples_per_prompt: 25
temperature: 0.7
max_new_tokens: 28
