construction:
  caa:
    method_root: caa_mean_activation_contrast
    paper_relation: paper_style_balanced_answer_letter_mean_difference
    source_dataset: pyvene/axbench-concept500
    source_revision: ad8a5d60c4616b599c24dd6689f05f696ec610f3
    source_inventory: prod_2b_l10_v1
    source_split: train
    source_genre: text
    pair_count: 300
    construction_manifest: experiments/emoji_method_comparison/caa.construction.yaml
    construction_manifest_status: selected_frozen_pre_output
    construction_payload_sha256: 2adbe915db030b2c7015d4bae03c5eff19e7dd6f96a0e5147a2b2e34f2e5ac48
    selection_rule: >-
      Deduplicate normalized input text, apply the frozen normal-text safety,
      length, target-leakage, and feasibility filters, sort by SHA-256 of the
      exact UTF-8 input, and take the first 300. Train rows only; no input hash
      may occur in calibration, evaluation, or transfer.
    input_length_characters: {minimum: 30, maximum: 300}
    positive_requirement: 'The response should include Unicode emojis and emoticons.'
    negative_requirement: 'The response should not include Unicode emojis or emoticons.'
    prompt_template: |-
      Instruction:
      {input}

      Choose the response requirement:
      (A) {option_a}
      (B) {option_b}
      Answer: (
    completion_surfaces: [A, B]
    completion_token_gate: each completion surface must encode to exactly one token
    option_balance: exactly 150 pairs with positive=A and 150 with positive=B
    option_assignment: positive_is_A_when_zero_based_construction_index_is_even
    paired_difference: same rendered prompt prefix; only the answer-letter completion changes
    activation_selector: registered model residual layer at the answer-letter token
    formula: d_raw = mean_i(h_positive_answer_i - h_negative_answer_i)
    aggregation: arithmetic_mean_over_all_300_or_fail
    missing_pair_policy: fail_closed_no_partial_mean
    orientation: toward_emoji_positive
    diagnostics:
      - separately report positive=A and positive=B oriented half-vectors
      - report their cosine and the odd/even split-half cosine
      - report raw norm and unit-vector SHA-256
    intervention_uses_unit_vector: true

  nla_phrase:
    method_root: nla_av_edit_ar
    paper_relation: canonical_av_edit_ar_style_root
    substrate_profile: model_matrix[active_model].nla_substrate
    edit_operator: append_exact_utf8
    append_separator: "\n\n"
    appended_text: 'The response should include Unicode emojis and emoticons.'
    formula: d_raw = AR(z_original + separator + appended_text) - AR(z_original)
    averaging: none
    orientation: edited_minus_original
    intervention_uses_unit_vector: true

  nla_glyph:
    method_root: nla_av_edit_ar
    paper_relation: canonical_av_edit_ar_minimal_surface_root
    substrate_profile: model_matrix[active_model].nla_substrate
    edit_operator: append_exact_utf8
    append_separator: "\n\n"
    appended_text: "\U0001F60A"
    appended_codepoints: [U+1F60A]
    formula: d_raw = AR(z_original + separator + appended_text) - AR(z_original)
    averaging: none
    orientation: edited_minus_original
    intervention_uses_unit_vector: true

  jlens_word_atom:
    method_root: j_lens_atom
    paper_relation: direct_registered_token_atom_not_nla_approximation
    lens_profile: model_matrix[active_model].jlens
    fit_corpus: experiments/jspace/data/fit_prompts.json
    fit_corpus_sha256: 68d2faa4ecbf7b98acc69ab71bcb3b47304f3be3075a29293a13f9fb777f7444
    fit_corpus_hash_rule: utf8_bytes_with_newlines_normalized_to_lf
    token_surface: ' emoji'
    surface_variant: leading_space
    token_gate: exact_single_token_encode_decode_round_trip_or_arm_fails
    token_id: pending_per_model_pod_tokenizer_receipt
    effective_final_norm_rule: evaluate_final_norm_on_all_ones_then_flatten
    formula: d_raw = J.T @ (effective_final_norm_scale * unembedding_row[token_id])
    minimum_split_half_atom_cosine: 0.90
    orientation: positive_token_logit
    intervention_uses_unit_vector: true
    prohibited_relabeling:
      - k25 NLA approximation
      - direct Unicode glyph atom
      - multi-token phrase atom
    glyph_diagnostic:
      surface: "\U0001F60A"
      action: record tokenizer resolution only
      behavioral_arm: false
      rule: >-
        Do not silently replace the word atom. If the glyph is single-token, a
        future versioned arm may register it as another direct atom. If it is
        multi-token, any sum is a separately declared linear combination.

common_intervention:
  purpose: hold administration constant so root constructions are comparable
  mode: decode
  taxonomy_scope: decode_only
  hook_layer: per_model_registered_layer
  hook_site: block_output_residual
  formula: h_prime = h + alpha * l2_norm(h) * unit_l2(direction)
  vector_view: unit_l2
  temperature: 0.7
  max_new_tokens: 192
  calibration_alphas: model_matrix[active_model].calibration_alphas
  calibration_prompts: 6
  calibration_prompt_source: historical_neutral_chat_bank
  calibration_prompt_manifest: experiments/emoji_method_comparison/prompts.calibration.yaml
  calibration_prompt_status: selected_frozen_pre_output
  calibration_prompt_payload_sha256: 9215021227360177a1d6aff82ffa84a1338473b0859c51ee1816e7f6124db48b
  calibration_samples_per_prompt: 3
  calibration_seed_offset: 10000
  heldout_prompts: 40
  heldout_prompt_tracks: {ordinary_optional: 30, formal_technical_transfer: 10}
  heldout_prompt_manifest: experiments/emoji_method_comparison/prompts.heldout.yaml
  heldout_prompt_status: selected_frozen_pre_output
  heldout_prompt_payload_sha256: db47f49590ed8532798e351a84d311e81653b3ef1cca574697857791353b98b0
  heldout_samples_per_prompt: 4
  heldout_seed_offset: 20000
  prompt_seed_scheme: prompt_offset_v1
  paired_seed_requirement: same prompt-specific seed across all arms and alpha zero
  alpha_selection: smallest_safe_alpha_within_locked_tolerance_of_best_calibration_effect_separately_per_model_and_treatment
  heldout_alpha_rule: one frozen alpha per treatment; no heldout alpha sweep
  heldout_chunk_size_prompts: 5
  chunk_resume_rule: exact_spec_integrity_and_expected_record_count
  canary:
    prompt_id: historical-01
    samples: 1
    alphas: alpha_zero_and_smallest_nonzero_model_alpha
    max_new_tokens: 32
    excluded_from_research_corpus: true

calibration_selection:
  schema: emoji-method-comparison-alpha-selection/v1
  primary_metric: target_present
  pairing_unit: prompt_id_x_generation_seed
  prompt_weighting: equal_after_averaging_seeds
  candidate_alphas: nonzero_frozen_model_ladder_only
  safety_passing_fraction: 0.90
  choose: smallest_absolute_safe_alpha_within_tolerance_of_best
  tolerance: max_0.02_presence_units_or_5_percent_of_absolute_best
  no_minimum_observed_effect_for_selection: true
  no_heldout_data_access: true
  failed_arm_policy: record_no_safe_alpha_and_exclude_from_heldout
  receipt_status_after_machine_validation: frozen_with_explicit_automated_audit_disclosure

arms:
  primary_treatments:
    - {id: caa, construction: caa}
    - {id: nla_phrase, construction: nla_phrase}
    - {id: nla_glyph, construction: nla_glyph}
  exploratory_preserved:
    - id: jlens_word_atom
      construction: jlens_word_atom
      behavioral_generation: false
      completed_qwen_protocol: crossmodel-qwen-l20-gemma-l32-caa-nla-jlens-emoji-v4
      role: preserved_exploratory_data_not_in_v5_primary_claim_family
  controls:
    - {id: baseline, method_root: none}
    - {id: explicit_prompt, method_root: none, prompt_suffix_from: target.explicit_prompt_positive_control}
    - {id: random_101, method_root: random_isotropic, direction_seed: 101}
    - {id: random_202, method_root: random_isotropic, direction_seed: 202}
    - {id: random_303, method_root: random_isotropic, direction_seed: 303}

evaluation:
  primary_comparison: paired target_present increase versus alpha zero and mean of three random directions
  primary_track: ordinary_optional
  transfer_track_role: formal_technical_intrusion_and_generalization_secondary
  prompt_tracks_are_never_pooled: true
  explicit_prompt_is_upper_bound_not_hidden_steering: true
  ascii_emoticons_are_not_counted_as_unicode_emoji: true
  primary_claim_multiplicity_family: [caa, nla_phrase, nla_glyph]
  model_results_are_stratified: true
  cross_model_pooling: forbidden
  prompt_block_bootstrap: {draws: 10000, seed: 20260824}
  prompt_block_signflip:
    exact_through_prompt_blocks: 20
    monte_carlo_draws_above_exact_limit: 200000
    seed: 20260825
  multiplicity: Holm_across_up_to_three_nonexcluded_primary_treatments_within_each_model
  random_comparison: treatment_paired_effect_minus_mean_of_three_random_paired_effects_at_the_same_locked_alpha
  primary_success_rule: >-
    Positive effects versus paired alpha zero and the mean random effect,
    intersection-union p below 0.05 after Holm correction, and the deterministic
    quality gate. Instruction relevance and fluency remain a separately
    disclosed blinded-rating condition before the strongest final claim.
  explicit_prompt_reporting: descriptive_upper_bound_only
  quality_gate:
    minimum_safe_output_fraction: 0.90
    minimum_unicode_words: 12
    minimum_length_fraction_of_paired_baseline: 0.50
    minimum_unique_unicode_word_ratio: 0.25
    maximum_token_run: 4
    maximum_dominant_token_fraction: 0.20
    maximum_character_run: 8
    maximum_replacement_characters: 0
    maximum_emoji_clusters: 6
    maximum_emoji_to_word_fraction: 0.10
    reject_hit_max_new_tokens: false

instruction_quality:
  status: post_generation_blinded_rating_required
  rubric_id: emoji-method-comparison-relevance-fluency/v1
  raters_required: 1
  sample_rule: baseline_once_plus_each_primary_locked_alpha_plus_explicit_prompt_for_every_prompt_at_lowest_generation_seed
  arm_identity_hidden_in_sheet: true
  relevance_scale: {0: fails_or_ignores_instruction, 1: partially_relevant, 2: fully_relevant}
  fluency_scale: {0: incoherent_or_unreadable, 1: understandable_with_problems, 2: fluent}
  minimum_acceptable_fraction: 0.90
  maximum_decline_percentage_points_vs_alpha_zero: 10

implementation_receipts_still_required:
  - base checkpoint, tokenizer, AV, and AR marker hashes
  - CAA and NLA vector raw norms, archives, member hashes, and unit hashes
  - J-lens word-token ID, encode/decode rendering, split-half cosine, norm, and unit hash
  - canary result, frozen alpha receipts, and external-output RunPod receipt
