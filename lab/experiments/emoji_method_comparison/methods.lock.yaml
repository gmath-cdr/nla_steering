frozen_on: '2026-08-24'
amended_on: '2026-08-25'
lock_scope: vector_construction_and_common_intervention
amendment_policy: >-
  Do not edit a frozen construction in place after any behavioral output exists.
  A changed phrase, glyph, atom surface, construction rule, or intervention
  protocol requires a new study_id and lock version.

amendment_from_v2:
  prior_study_id: crossmodel-qwen-l20-gemma-l32-caa-nla-jlens-emoji-v2
  prior_status: calibration_only_pilot_complete_no_heldout_generation_or_analysis
  reason: >-
    At the 96-token ceiling, 77.8--83.3 percent of Qwen outputs at alpha 0.1
    reached max_new_tokens even though lexical diversity, repetition, Unicode,
    and replacement-character diagnostics remained coherent. The ceiling made
    the frozen truncation gate non-diagnostic.
  only_protocol_change: common_intervention.max_new_tokens_from_96_to_192
  unchanged:
    - all construction texts, source examples, directions, and root methods
    - calibration and held-out prompt payloads
    - model-specific alpha ladders, seeds, temperature, and hook administration
    - target endpoint, all deterministic quality thresholds, and statistics
  heldout_specs_materialized_or_outputs_generated_in_v2: false

amendment_from_v3:
  prior_study_id: crossmodel-qwen-l20-gemma-l32-caa-nla-jlens-emoji-v3
  prior_status: calibration_only_complete_no_heldout_generation_or_analysis
  reason: >-
    At the 192-token ceiling, 72.2--77.8 percent of Qwen alpha-0.1
    calibration outputs reached max_new_tokens. The corresponding unsteered
    baselines usually reached the same fixed ceiling, and every other frozen
    coherence check passed at alpha 0.1 for all four treatments. Absolute
    truncation was therefore a property of ordinary response length under the
    common cap, not a diagnostic of steering-induced degeneration.
  only_protocol_change: evaluation.quality_gate.reject_hit_max_new_tokens_from_true_to_false
  unchanged:
    - all construction texts, source examples, directions, and root methods
    - calibration and held-out prompt payloads
    - model-specific alpha ladders, seeds, temperature, response ceiling, and hook administration
    - target endpoint, every non-truncation quality threshold, and statistics
  truncation_reporting: >-
    hit_max_new_tokens remains stored per generation and reported by arm,
    alpha, and prompt track; it is not an automatic exclusion criterion.
  heldout_specs_materialized_or_outputs_generated_in_v3: false

amendment_from_v4:
  prior_study_id: crossmodel-qwen-l20-gemma-l32-caa-nla-jlens-emoji-v4
  prior_status: qwen_complete_gemma_no_behavioral_output
  reason: >-
    The completed Qwen J-lens atom arm is preserved as exploratory evidence but
    is excluded from the main scientific framing. Before any Gemma behavioral
    output was generated, the Gemma stratum was narrowed to CAA, NLA phrase,
    and NLA glyph treatments plus the already frozen controls.
  only_protocol_change: remove_jlens_word_atom_from_gemma_behavioral_generation_and_primary_claim_family
  unchanged:
    - all 40 held-out prompts and six calibration prompts
    - CAA, NLA phrase, and NLA glyph construction texts and rules
    - model checkpoints, layers, seeds, temperature, response ceiling, and hook administration
    - baseline, explicit-prompt, and three isotropic-random controls
    - target endpoint, deterministic quality thresholds, and statistics
  qwen_v4_results_preserved_unchanged: true
  qwen_v4_jlens_status: exploratory_preserved_outside_v5_primary_family
  gemma_behavioral_outputs_generated_in_v4: false

claim_scope: >-
  Two-model AxBench-Concept500-input open-ended emoji steering comparison of
  CAA, NLA phrase, and NLA glyph directions on Qwen2.5-7B at residual layer 20
  and Gemma-3-12B at residual layer 32. This is not an official AxBench score
  and not a paper-exact replication of every method's original intervention
  convention. Results are stratified by model and never transport a direction
  between residual spaces. The completed Qwen direct J-lens atom arm remains
  available only as separately labeled exploratory evidence.

target:
  primary_behavior: Unicode emoji cluster presence in an otherwise relevant response
  requested_amount: unrestricted
  primary_metric: target_present
  secondary_metrics:
    - emoji_cluster_count
    - emoji_clusters_per_100_unicode_words
    - ascii_emoticon_present
    - ascii_emoticon_count
    - instruction_relevance
    - fluency
  phrase_surface: 'The response should include Unicode emojis and emoticons.'
  explicit_prompt_positive_control: 'Use context-appropriate Unicode emojis and emoticons in your response.'
  glyph_surface: "\U0001F60A"
  glyph_codepoint: U+1F60A
  glyph_unicode_name: SMILING FACE WITH SMILING EYES
  glyph_count: 1
  rationale_for_one_glyph: minimal surface edit without confounding identity with repetition count

