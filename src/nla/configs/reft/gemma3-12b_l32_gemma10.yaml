# LoReFT baseline for the ten concepts independently confirmed on Gemma-3-12B-IT.
generate:
  output_length: 128
  keep_orig_axbench_format: false

train:
  model_name: "google/gemma-3-12b-it"
  layer: 32
  component: "res"
  seed: 42
  use_bf16: true
  output_length: 128
  overwrite_data_dir: "src/axbench/axbench/concept500/gemma10/generate"
  dump_dir: "artifacts/rebuilt/gemma3-12b/baseline_gemma10_2026/reft"
  models:
    LoReFT:
      # Gemma-3-12B plus batch-9 logits exceeds a 40 GB A100. Preserve the
      # original effective batch of 36 with a smaller microbatch.
      batch_size: 3
      gradient_accumulation_steps: 12
      n_epochs: 24
      lr: 0.0004
      weight_decay: 0.00
      low_rank_dimension: 4
      reft_layers: [32]
      reft_positions: "f5+l5"
      reft_type: "Loreft"
      binarize_dataset: false
      train_on_negative: false
      exclude_bos: true
